name: Build Android APK

# Run this by hand: GitHub repository -> Actions -> "Build Android APK" -> Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Copy the web app into www/
        run: |
          mkdir -p www/icons
          cp index.html app.js styles.css manifest.webmanifest www/
          cp icons/icon.svg www/icons/

      - name: Create the Android project
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/local-notifications@7
          echo '{"appId":"io.github.rookiee246.recallflow","appName":"RecallFlow","webDir":"www"}' > capacitor.config.json
          npx cap add android
          npx cap sync android

      - name: Declare only the two permissions needed for reminders
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <application#' android/app/src/main/AndroidManifest.xml
          grep -n "uses-permission" android/app/src/main/AndroidManifest.xml

      - name: Signing key (uses android-build/debug.keystore if you uploaded it, otherwise makes one)
        run: |
          mkdir -p ~/.android
          if [ -f android-build/debug.keystore ]; then
            cp android-build/debug.keystore ~/.android/debug.keystore
          else
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Collect the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk RecallFlow.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RecallFlow-apk
          path: RecallFlow.apk

      - name: Publish as a GitHub Release (easy to download on your phone)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "apk-${{ github.run_number }}" RecallFlow.apk \
            --title "RecallFlow Android app (build ${{ github.run_number }})" \
            --notes "Download RecallFlow.apk on your Android phone and open it to install."
